<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ploteo Baires</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --azul: #0A003F;
    --azul-suave: #EDEEF6;
    --blanco: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--blanco);
    color: var(--azul);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero ---------- */
  .hero {
    height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .logo-button {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: block;
  }

  .logo-button img {
    width: 150px;
    height: auto;
    display: block;
    transition: opacity 0.2s ease;
  }

  .logo-button:hover img {
    opacity: 0.75;
  }

  .logo-button:focus-visible {
    outline: 2px solid var(--azul);
    outline-offset: 6px;
  }

  .scroll-hint {
    margin-top: 2.5rem;
    width: 1px;
    height: 42px;
    background: var(--azul);
    opacity: 0.35;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.5; }
  }

    /* ---------- Nav (Portfolio | Contacto) ---------- */
  .nav-section {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blanco);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
  }

  .nav-links a {
    color: var(--azul);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: opacity 0.2s ease, border-color 0.2s ease;
  }

  .nav-links a:hover {
    opacity: 0.75;
    border-color: var(--azul);
  }

  .nav-links span {
    opacity: 0.35;
  }

  /* ---------- Portfolio ---------- */
  .portfolio {
    padding: 4rem 1.5rem 5rem;
    background: var(--blanco);
  }

  .portfolio-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .portfolio h2 {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0 0 2.5rem;
  }

  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  .portfolio-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    aspect-ratio: 4 / 5;
  }

  @media (max-width: 560px) {
    .portfolio-grid { grid-template-columns: 1fr; }
  }

  .portfolio-grid img {
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.97);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    z-index: 999;
  }

  .lightbox.abierto {
    display: flex;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .lightbox-cerrar {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: var(--azul);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.5rem;
  }

  .lightbox-cerrar:hover {
    opacity: 0.75;
  }

  /* ---------- Info ---------- */
  .info {
    background: var(--azul-suave);
    padding: 5rem 1.5rem 6rem;
  }

  .info-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
  }

  .grupo h2 {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0 0 1rem;
  }

  .grupo p, .grupo a {
    margin: 0;
    color: var(--azul);
  }

  .contacto-lista {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .contacto-lista a {
    text-decoration: none;
    font-size: 1.05rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
    width: fit-content;
    display: inline-flex;
    align-items: center;
  }

  .contacto-lista a:hover {
    border-color: var(--azul);
  }

  .redes-lista {
    display: flex;
    gap: 1.1rem;
  }

  .red-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border: 1px solid var(--azul);
    border-radius: 50%;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .red-link i {
    font-size: 18px;
    color: var(--azul);
    transition: color 0.2s ease;
  }

  .red-link:hover {
    background: var(--azul);
  }

  .red-link:hover i {
    color: var(--blanco);
  }

  .whatsapp-icono {
    color: var(--azul);
    font-size: 1.05rem;
  }

  .horario-lista p {
    font-size: 1.05rem;
    line-height: 1.7;
  }

  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    font-size: 0.75rem;
    color: var(--azul);
    opacity: 0.5;
  }

  @media (max-width: 400px) {
    .logo-button img { width: 120px; }
  }
</style>
</head>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.portfolio-grid img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('abierto');
    });
  });

  function cerrarLightbox() {
    lightbox.classList.remove('abierto');
    lightboxImg.src = '';
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) cerrarLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cerrarLightbox();
  });
</script>
